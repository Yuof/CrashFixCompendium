; Crash Fix Compendium - the defaults. An update replaces this file: put your own choices in
; CrashFixCompendium_Custom.ini, which appears here after the first start and is never replaced.
; 1 = on, 0 = off. Changes apply at the next game start.

[Fixes]
; A rare crash on the start-up loading screen: an SKSE mod installs a hook while the loading screen is running.
StartupHook=1
; A crash shortly after loading a save: an NPC saved while waiting to play a start, stop or turn animation.
PathIdle=1
; A crash during console commands (coc, cow, batch files, ConsoleUtil): IsInCombat asked about an object.
IsInCombat=1
; A crash in whatever reads a menu's name next: two threads queue a menu message at once and release the name twice.
UIMessageQueue=1
; A crash when two hits give one tree or actor its first decals at the same moment.
SkinnedDecal=1
; A crash with the free camera: the player's combat group is updated on two threads at once.
FreeCamera=1
; Precision 2.0.6: a crash when an attacker is disabled or removed in the middle of a swing.
DisabledAttacker=1
; Engine Fixes 7.0.15 to the 7.0.21 beta and alandtse's fork 7.13.0: a crash in EngineFixes.dll because its ShadowMap fix runs on a misaligned stack.
ShadowMapStackAlign=1
; A crash when a house or shop owner starts escorting someone out of a home or shop: the escort is built with one setting left unset.
TrespassPursue=1
; A crash when a footprint, blood or hit mark lands on certain meshes: the game makes the table for the mesh's vertices too small.
DecalVertexTable=1
; A crash in crowded places, as soon as more than 50 characters are loaded nearby: the game moves its foot-IK table while it is in use.
FootIkRaycast=1
; A crash in the Magic menu when the unlock key is pressed on a shout that has fewer than three words (a mod's shout).
ShoutEmptyWord=1
; A crash while a mesh loads: a .nif in which a block names a string past the end of the file's string list.
NifStringIndex=1
; A crash in XAudio2_7.dll when a sound starts: its file is a format the game can't read (32-bit float, ADPCM, an .mp3
; renamed) or its header says 0 channels. Such a sound now stays silent and the log gives its id.
AudioFormat=1
; A crash while an NPC's ragdoll follows its animation: the game switches a ragdoll joint on or off before the joint
; is in the physics world. Most likely cause: two game functions change the physics world without locking it. They
; now lock it when it is free, and queue their change while another thread holds it.
RagdollWorldLock=1

[Reports]
; Lists in CrashFixCompendium.log every sound file in Data (loose, and in .bsa archives that aren't compressed) that the game won't
; play. Reads every sound file once after the game starts, in the background.
; Use this if you had an XAudio2_7.dll crash and want to know which mod was the culprit.
AudioFormatScan=0
